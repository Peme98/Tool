function groupView(){return `<div class="party-grid">${heroes.map((h,i)=>{let s=st(h),m=mx(h);return `<div class="party-card"><h3>${esc(h.name)}</h3><div class="muted">${esc(h.pers?.placeofbirth||'')} · AP ${h.ap?.total??'–'}</div><div class="pills"><span class="pill">LE ${s.hp}/${m}</span><span class="pill">${weps(h).length} Waffen</span></div><div class="hpbar"><i style="width:${Math.max(0,Math.min(100,s.hp/m*100))}%"></i></div><button class="btn small" onclick="active=${i};render()">Heldenbogen öffnen</button></div>`}).join('')||'<p>Noch keine Helden.</p>'}</div>`}

function fightView(){let l=[...heroes.map((h,i)=>({H:1,h,i,s:st(h)})).filter(x=>x.s.on),...ft.foes.map((e,i)=>({H:0,e,i,s:e}))].sort((a,b)=>b.s.ini-a.s.ini);return `<div class="fight-layout"><main><div class="actions"><button class="btn" onclick="rollAll()">INI für alle würfeln</button><span class="muted">Automatisch absteigend sortiert</span></div><div class="fighters">${l.map(fighter).join('')||'<p>Keine Teilnehmer.</p>'}</div></main><aside><div class="card"><h2>Gegner</h2><div class="card-body foeform"><select id="ar" onchange="preset(this.value)"><option value="">Frei</option>${Object.entries(AR).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><input id="gn" value="Gegner" placeholder="Name"><div class="two"><input id="gi" type="number" value="12" placeholder="INI"><input id="gh" type="number" value="25" placeholder="LE"></div><div class="two"><input id="ga" type="number" value="12" placeholder="AT"><input id="gp" type="number" value="7" placeholder="PA"></div><div class="two"><input id="gr" type="number" value="1" placeholder="RS"><input id="gt" value="1W6+2" placeholder="TP"></div><button class="btn" onclick="addFoe()">Hinzufügen</button></div></div><div class="card"><h2>Helden wählen</h2><div class="card-body">${heroes.map((h,i)=>`<label class="row"><input type="checkbox" ${st(h).on?'checked':''} onchange="st(heroes[${i}]).on=this.checked;saveFT();render()"><span class="name">${esc(h.name)}</span></label>`).join('')}</div></div><button class="btn danger" style="width:100%" onclick="if(confirm('Kampf zurücksetzen?')){ft={foes:[],hs:{}};saveFT();render()}">Zurücksetzen</button></aside></div>`}
function fighter(x){if(x.H){let {h,i,s}=x,m=mx(h),ww=weps(h),w=ww[s.w]||ww[0],ct=w?Number(h.ct?.[w.combatTechnique]||6):0,at=w?ct+Number(w.at||0):0,pv=w&&w.reloadTime==null?Math.round(ct/2)+Number(w.pa||0):null;return `<div class="fighter hero"><div class="inibox">INI<b>${s.ini}</b><small>${s.base}+${s.die||'–'}</small></div><div><div class="fname">${esc(h.name)}</div><select class="weaponpick" onchange="st(heroes[${i}]).w=Number(this.value);saveFT();render()">${ww.map((q,j)=>`<option value="${j}" ${j==s.w?'selected':''}>${esc(q.name)}</option>`).join('')||'<option>Keine Waffe</option>'}</select><div class="fmeta">RS ${s.rs??'–'} · Schmerz ${pa(s,m)} · ${w?`AT ${at} · PA ${pv??'–'} · TP ${w.damageDiceNumber||1}W${w.damageDiceSides}${Number(w.damageFlat||0)>=0?'+':''}${w.damageFlat||0}`:''}</div><div class="actions">${w?`<button class="btn small" onclick="active=${i};singleCheck('${esc(w.name)} AT',${at},'Attacke')">AT</button>${pv==null?'':`<button class="btn small secondary" onclick="active=${i};singleCheck('${esc(w.name)} PA',${pv},'Parade')">PA</button>`}<button class="btn small" onclick="active=${i};damageRoll('${esc(w.name)}',${w.damageDiceNumber||1},${w.damageDiceSides||6},${w.damageFlat||0})">TP</button>`:''}</div></div><div class="hpedit"><button class="btn small danger" onclick="hpH(${i},-1)">−</button><input value="${s.hp}" onchange="hpHS(${i},this.value)"><span>/${m} LE</span><button class="btn small" onclick="hpH(${i},1)">+</button><label>RS <input class="rsinput" value="${s.rs}" onchange="rsH(${i},this.value)"></label><select onchange="painH(${i},this.value)"><option value="a" ${s.pain===null?'selected':''}>Auto ${pa(s,m)}</option>${[0,1,2,3,4].map(n=>`<option value="${n}" ${s.pain===n?'selected':''}>Schmerz ${n}</option>`).join('')}</select><button class="btn small secondary" onclick="iniH(${i})">INI</button></div></div>`}let e=x.e;return `<div class="fighter enemy"><div class="inibox">INI<b>${e.ini}</b><small>${e.base}+${e.die}</small></div><div><div class="fname">${esc(e.name)}</div><div class="fmeta">RS ${e.rs} · Schmerz ${pa(e,e.max)} · AT ${e.at} · PA ${e.pv} · TP ${esc(e.tp)}</div><div class="actions"><button class="btn small" onclick="singleCheck('${esc(e.name)} AT',${e.at},'Attacke')">AT</button><button class="btn small secondary" onclick="singleCheck('${esc(e.name)} PA',${e.pv},'Parade')">PA</button><button class="btn small" onclick="tpF(${x.i})">TP</button></div></div><div class="hpedit"><button class="btn small danger" onclick="hpF(${x.i},-1)">−</button><input value="${e.hp}" onchange="hpFS(${x.i},this.value)"><span>/${e.max} LE</span><button class="btn small" onclick="hpF(${x.i},1)">+</button><label>RS <input class="rsinput" value="${e.rs}" onchange="rsF(${x.i},this.value)"></label><select onchange="painF(${x.i},this.value)"><option value="a" ${e.pain===null?'selected':''}>Auto ${pa(e,e.max)}</option>${[0,1,2,3,4].map(n=>`<option value="${n}" ${e.pain===n?'selected':''}>Schmerz ${n}</option>`).join('')}</select><button class="btn small secondary" onclick="iniF(${x.i})">INI</button><button class="btn small danger" onclick="ft.foes.splice(${x.i},1);saveFT();render()">×</button></div></div>`}
function iniH(i){let s=st(heroes[i]);s.die=roll(6);s.ini=s.base+s.die;saveFT();render()}function iniF(i){let e=ft.foes[i];e.die=roll(6);e.ini=e.base+e.die;saveFT();render()}function rollAll(){heroes.forEach((h,i)=>{if(st(h).on)iniH(i)});ft.foes.forEach((e,i)=>iniF(i));saveFT();render()}function hpH(i,d){st(heroes[i]).hp+=d;saveFT();render()}function hpHS(i,v){st(heroes[i]).hp=Number(v);saveFT();render()}function rsH(i,v){st(heroes[i]).rs=Number(v);saveFT();render()}function painH(i,v){st(heroes[i]).pain=v==='a'?null:Number(v);saveFT();render()}function hpF(i,d){ft.foes[i].hp+=d;saveFT();render()}function hpFS(i,v){ft.foes[i].hp=Number(v);saveFT();render()}function rsF(i,v){ft.foes[i].rs=Number(v);saveFT();render()}function painF(i,v){ft.foes[i].pain=v==='a'?null:Number(v);saveFT();render()}
function preset(k){if(!k)return;let v=AR[k];$('#gn').value=v[0];$('#gi').value=v[1];$('#gh').value=v[2];$('#ga').value=v[3];$('#gp').value=v[4];$('#gr').value=v[5];$('#gt').value=v[6]}function addFoe(){let b=Number($('#gi').value),d=roll(6),m=Number($('#gh').value);ft.foes.push({name:$('#gn').value,base:b,die:d,ini:b+d,hp:m,max:m,at:Number($('#ga').value),pv:Number($('#gp').value),rs:Number($('#gr').value),tp:$('#gt').value,pain:null});saveFT();render()}function tpF(i){let e=ft.foes[i],m=e.tp.match(/(\d+)W(\d+)([+-]\d+)?/i);if(m)damageRoll(e.name,+m[1],+m[2],+(m[3]||0))}
function renderTabs(){const t=$('#tabs');t.innerHTML=`<button class="tab ${active===-2?'active':''}" onclick="active=-2;render()">Übersicht</button>`+heroes.map((h,i)=>`<button class="tab ${i===active?'active':''}" onclick="active=${i};render()">${esc(h.name||'Held '+(i+1))}</button>`).join('')}
function setSection(s){section=s;render()}
function panel(h){if(section==='talents')return talentPanel(h);if(section==='combat')return combatPanel(h);if(section==='magic')return magicPanel(h);if(section==='inventory')return inventoryPanel(h);if(section==='raw')return `<section class="panel active"><pre class="raw">${esc(JSON.stringify(h,null,2))}</pre></section>`;return overviewPanel(h)}
function overviewPanel(h){const tal=Object.keys(h.talents||{}).sort((a,b)=>(h.talents[b]||0)-(h.talents[a]||0)).slice(0,10);return `<section class="panel active"><div class="grid"><div class="card"><h2>Persönliches</h2><div class="card-body">${[['Sippe',h.pers?.family],['Geburtsort',h.pers?.placeofbirth],['Größe',h.pers?.size? h.pers.size+' cm':''],['Gewicht',h.pers?.weight?h.pers.weight+' kg':''],['Ortskenntnis',h.pers?.cultureAreaKnowledge]].map(x=>`<div class="row"><span class="name">${x[0]}</span><b>${esc(x[1]||'–')}</b></div>`).join('')}</div></div><div class="card"><h2>Beste Talente</h2><div class="card-body">${tal.map(id=>talRow(h,id)).join('')||'<p>Keine Talente vorhanden.</p>'}</div></div><div class="card"><h2>Kampftechniken</h2><div class="card-body">${Object.entries(h.ct||{}).map(([id,v])=>`<div class="row"><span class="name">${esc(CTS[id]||id)}</span><b>${v}</b><button class="btn small" onclick="singleCheck('${esc(CTS[id]||id)}',${v},'Kampftechnik')">Probe</button></div>`).join('')||'<p>Keine Kampftechniken.</p>'}</div></div><div class="card"><h2>Letzte Proben</h2><div class="card-body live-log">${logHtml()}</div></div></div></section>`}
function talRow(h,id){const d=TALENTS[id]||[id,[0,1,2]],v=Number(h.talents?.[id]??0);return `<div class="row"><span class="name"><b>${esc(d[0])}</b><span class="muted"> ${d[1].map(i=>ATTR[i]).join('/')}</span></span><span class="badge">FW ${v}</span><button class="btn small" onclick="talentCheck('${id}')">Probe</button></div>`}
function talentPanel(h){const gs=[['Körpertalente',1,14],['Gesellschaftstalente',15,23],['Naturtalente',24,30],['Wissenstalente',31,42],['Handwerkstalente',43,59]];return `<section class="panel active"><input class="search" placeholder="Alle Talente filtern…" oninput="filterRows(this.value,'talentRows')"><div class="talent-groups" id="talentRows">${gs.map(([n,a,b])=>`<div class="card"><h2>${n}</h2><div class="card-body">${Array.from({length:b-a+1},(_,i)=>talRow(h,'TAL_'+(a+i))).join('')}</div></div>`).join('')}</div></section>`}
function armorItems(h){return Object.values(h.belongings?.items||{}).filter(x=>x.protection!=null||x.rs!=null||x.encumbrance!=null||x.be!=null||x.gr===4)}
function armorPanel(h){const a=armorItems(h);return `<div class="card"><h2>Rüstungen</h2><div class="card-body"><table class="sheet-table"><thead><tr><th>Rüstung</th><th>RS</th><th>BE</th><th>Gewicht</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.protection??x.rs??'–'}</td><td>${x.encumbrance??x.be??'–'}</td><td>${x.weight??'–'}</td></tr>`).join('')||'<tr><td colspan="4">Keine Rüstung im Export erkannt.</td></tr>'}</tbody></table></div></div>`}
function combatPanel(h){const items=Object.values(h.belongings?.items||{}).filter(x=>x.combatTechnique);return `<section class="panel active"><div class="grid"><div class="card"><h2>Waffen</h2><div class="card-body">${items.map((it,i)=>weaponRow(h,it,i)).join('')||'<p>Keine Waffen erkannt.</p>'}</div></div><div class="card"><h2>Kampftechniken</h2><div class="card-body">${Object.keys(CTS).map(id=>{const v=Number(h.ct?.[id]??6);return `<div class="row"><span class="name">${esc(CTS[id])}</span><b>FW ${v}</b><button class="btn small" onclick="singleCheck('${esc(CTS[id])}',${v},'Kampftechnik')">1W20</button></div>`}).join('')}</div></div>${armorPanel(h)}<div class="card"><h2>Probenprotokoll</h2><div class="card-body live-log">${logHtml()}</div></div></div></section>`}
function weaponStats(h,it){const ct=Number(h.ct?.[it.combatTechnique]||0),a=attrs(h),ranged=it.reloadTime!=null,at=ct+Number(it.at||0),pa=ranged?null:Math.round(ct/2)+Number(it.pa||0);return{at,pa,ranged}}
function weaponRow(h,it,i){const s=weaponStats(h,it);return `<div class="row"><span class="name"><b>${esc(it.name)}</b><span class="muted"> ${esc(CTS[it.combatTechnique]||it.combatTechnique)} · ${it.damageDiceNumber||1}W${it.damageDiceSides||6}${Number(it.damageFlat||0)>=0?'+':''}${it.damageFlat||0}</span></span><button class="btn small" onclick="singleCheck('${esc(it.name)} AT',${s.at},'Attacke')">AT ${s.at}</button>${s.pa==null?'':`<button class="btn small secondary" onclick="singleCheck('${esc(it.name)} PA',${s.pa},'Parade')">PA ${s.pa}</button>`}<button class="btn small" onclick="damageRoll('${esc(it.name)}',${it.damageDiceNumber||1},${it.damageDiceSides||6},${it.damageFlat||0})">TP</button></div>`}
function spellValue(v){return Number(v?.value??v?.sr??v??0)||0}
function spellRow(id,v,label){const d=SPELLS[id],fw=spellValue(v),name=d?.name||id,meta=d?`${d.check.map(i=>ATTR[i]).join('/')} · ${d.group}${d.ic?' · '+d.ic:''}${d.mod?' · '+d.mod:''}`:'Unbekannte ID';return `<div class="row"><span class="name"><b>${esc(name)}</b><span class="muted"> ${esc(meta)}</span></span><span class="badge">FW ${fw}</span><button class="btn small" onclick="spellCheck('${esc(id)}',${fw},'${label}')">Probe</button></div>`}
function magicPanel(h){const groups=[['Magische Fertigkeiten',h.spells],['Liturgien',h.liturgies]];return `<section class="panel active"><div class="grid">${groups.map(([n,o])=>`<div class="card"><h2>${n}</h2><div class="card-body"><input class="search" placeholder="${n} filtern…" oninput="filterRows(this.value,'${n==='Magische Fertigkeiten'?'spellRows':'liturgyRows'}')"><div id="${n==='Magische Fertigkeiten'?'spellRows':'liturgyRows'}">${Object.entries(o||{}).sort(([a],[b])=>(SPELLS[a]?.name||a).localeCompare(SPELLS[b]?.name||b,'de')).map(([id,v])=>spellRow(id,v,n)).join('')||`<p>Keine ${n.toLowerCase()} im Export.</p>`}</div></div></div>`).join('')}<div class="card"><h2>Zauberdatenbank</h2><div class="card-body"><p><b>${Object.keys(SPELLS).length}</b> allgemein geeignete Optolith-Einträge sind offline eingebettet.</p><p class="muted">Unbekannte oder zukünftig ergänzte IDs bleiben sichtbar und können weiterhin mit frei wählbaren Eigenschaften gewürfelt werden.</p></div></div></div></section>`}
function spellCheck(id,fw,type){const d=SPELLS[id];if(!d)return genericTriple(id,fw,type);const av=attrs(heroes[active]);openTriple(d.name,d.check.map(i=>av[i]),d.check.map(i=>ATTR[i]),fw,type,false,d.mod)}
function inventoryPanel(h){const items=Object.values(h.belongings?.items||{});return `<section class="panel active"><div class="card"><h2>Besitz</h2><div class="card-body"><table class="items-table"><thead><tr><th>Gegenstand</th><th>Anzahl</th><th>Gewicht</th><th>Gruppe</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.amount||1}</td><td>${x.weight??'–'}</td><td>${x.gr??'–'}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function filterRows(q,id){q=q.toLowerCase();document.querySelectorAll(`#${id} .row`).forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))}
function talentCheck(id){const h=heroes[active],d=TALENTS[id]||[id,[0,1,2]],av=attrs(h),fw=Number(h.talents[id]||0);openTriple(d[0],d[1].map(i=>av[i]),d[1].map(i=>ATTR[i]),fw,'Talent')}
function genericTriple(name,fw,type){const av=attrs(heroes[active]);openTriple(name,av.slice(0,3),ATTR.slice(0,3),Number(fw)||0,type,true)}
function openTriple(name,vals,names,fw,type,editable=false,checkMod=""){$('#modalTitle').textContent=`${type}: ${name}`;const options=ATTR.map((x,i)=>`<option value="${i}">${x}</option>`).join('');$('#modalBody').innerHTML=`<div class="form-grid"><div class="field"><label>Fertigkeitswert</label><input id="rFw" type="number" value="${fw}"></div><div class="field"><label>Modifikator</label><input id="rMod" type="number" value="0"><span class="muted">positiv = Erleichterung${checkMod?' · Widerstand: '+esc(checkMod):''}</span></div>${[0,1,2].map((_,i)=>editable?`<div class="field"><label>Eigenschaft ${i+1}</label><select id="sel${i}">${options}</select></div>`:`<div class="field"><label>${names[i]}</label><input id="attr${i}" type="number" value="${vals[i]}"></div>`).join('')}</div><div class="footer-actions"><button class="btn secondary" onclick="closeModal()">Schließen</button><button class="btn" onclick="doTriple('${esc(name)}','${type}',${editable})">3W20 würfeln</button></div><div id="rollResult"></div>`;if(editable)[0,1,2].forEach(i=>$('#sel'+i).value=i);$('#modal').classList.add('open')}
function doTriple(name,type,editable){const h=heroes[active],av=attrs(h),fw=Number($('#rFw').value)||0,mod=Number($('#rMod').value)||0;const vals=[0,1,2].map(i=>editable?av[Number($('#sel'+i).value)]:Number($('#attr'+i).value));const rolls=[roll(),roll(),roll()];let rem=fw+mod;rolls.forEach((r,i)=>{if(r>vals[i])rem-=r-vals[i]});const ones=rolls.filter(x=>x===1).length,twenties=rolls.filter(x=>x===20).length;let ok=rem>=0,text=ok?'Erfolgreich':'Misslungen';if(ones>=2){ok=true;text='Kritischer Erfolg'}if(twenties>=2){ok=false;text='Patzer'}const qs=ok?Math.min(6,Math.max(1,Math.ceil(Math.max(0,rem)/3))):0;const detail=`Würfe ${rolls.join(', ')} gegen ${vals.join('/')} · FW ${fw} · Mod ${mod>=0?'+':''}${mod} · Rest ${rem}${ok?' · QS '+qs:''}`;$('#rollResult').innerHTML=`<div class="dice">${rolls.map(x=>`<div class="die">${x}</div>`).join('')}</div><div class="result ${ok?'ok':'bad'}"><b>${text}</b><br>${detail}</div>`;addLog(name,text,detail)}
function singleCheck(name,value,type){$('#modalTitle').textContent=`${type}: ${name}`;$('#modalBody').innerHTML=`<div class="form-grid"><div class="field"><label>Zielwert</label><input id="singleVal" type="number" value="${value}"></div><div class="field"><label>Modifikator</label><input id="singleMod" type="number" value="0"><span class="muted">positiv = Erleichterung</span></div></div><div class="footer-actions"><button class="btn secondary" onclick="closeModal()">Schließen</button><button class="btn" onclick="doSingle('${esc(name)}','${type}')">1W20 würfeln</button></div><div id="rollResult"></div>`;$('#modal').classList.add('open')}
function doSingle(name,type){const value=Number($('#singleVal').value)||0,mod=Number($('#singleMod').value)||0,target=value+mod,r=roll();let ok=r<=target,text=ok?'Erfolgreich':'Misslungen';if(r===1){ok=true;text='Kritischer Erfolg'}if(r===20){ok=false;text='Patzer'}const detail=`Wurf ${r} gegen ${target} (Basis ${value}, Mod ${mod>=0?'+':''}${mod})`;$('#rollResult').innerHTML=`<div class="dice"><div class="die">${r}</div></div><div class="result ${ok?'ok':'bad'}"><b>${text}</b><br>${detail}</div>`;addLog(name,text,detail)}
function damageRoll(name,n,sides,flat){$('#modalTitle').textContent=`Trefferpunkte: ${name}`;$('#modalBody').innerHTML=`<p class="muted">Schadensformel: <b>${n}W${sides}${flat>=0?'+':''}${flat}</b></p><div id="damageResult"><p class="muted">Noch nicht gewürfelt.</p></div><div class="footer-actions"><button class="btn secondary" onclick="closeModal()">Schließen</button><button class="btn" onclick="doDamageRoll('${esc(name)}',${n},${sides},${flat})">TP würfeln</button></div>`;$('#modal').classList.add('open')}
function doDamageRoll(name,n,sides,flat){const rs=Array.from({length:n},()=>roll(sides)),sum=rs.reduce((a,b)=>a+b,0)+Number(flat);$('#damageResult').innerHTML=`<div class="dice">${rs.map(x=>`<div class="die">${x}</div>`).join('')}</div><div class="result ok"><b>${sum} Trefferpunkte</b><br>${n}W${sides}${flat>=0?'+':''}${flat}</div>`;addLog(name,'Schaden',`${sum} TP`)}
function addLog(name,result,detail){rollLog.unshift({time:new Date().toLocaleTimeString('de-DE'),hero:heroes[active]?.name,name,result,detail});rollLog=rollLog.slice(0,40);document.querySelectorAll('.live-log').forEach(x=>x.innerHTML=logHtml())}
function logHtml(){const a=rollLog.filter(x=>x.hero===heroes[active]?.name).slice(0,12);return a.length?a.map(x=>`<div class="log-entry"><b>${esc(x.name)}: ${esc(x.result)}</b><br><span class="muted">${x.time} · ${esc(x.detail)}</span></div>`).join(''):'<p class="muted">Noch keine Proben gewürfelt.</p>'}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#importBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=async e=>{for(const f of e.target.files){try{const d=JSON.parse(await f.text());if(Array.isArray(d))heroes.push(...d);else heroes.push(d)}catch(err){alert(`${f.name} konnte nicht gelesen werden: ${err.message}`)}}if(heroes.length&&active<0)active=0;e.target.value='';render()};
$('#removeBtn').onclick=()=>{if(active<0)return;if(confirm(`„${heroes[active].name}“ aus diesem Heldenbuch entfernen?`)){heroes.splice(active,1);active=Math.min(active,heroes.length-1);render()}};
$('#saveBtn').onclick=()=>{if(!heroes.length)return;const clone=document.documentElement.cloneNode(true);const data=clone.querySelector('#embedded-data');data.textContent=JSON.stringify(heroes).replaceAll('<','\\u003c');const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='DSA-Heldenbuch.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
render();
</script></body></html>
